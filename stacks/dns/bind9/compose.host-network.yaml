# Optional: run BIND on the host network (e.g. to see real client IPs for IPv6 or to avoid NAT).
#   docker compose -f compose.yaml -f compose.host-network.yaml up -d
# named listens on port 53 directly, so it starts as root with NET_BIND_SERVICE and immediately
# drops to the `bind` user (`named -u bind`, done by the image entrypoint).

services:
  bind9:
    # HARDENING-EXCEPTION: host network — opt-in; DNS served straight from the host's interfaces.
    network_mode: host
    user: "0:0"
    cap_add:
      - NET_BIND_SERVICE  # port 53 in the host network namespace
      - SETUID            # named -u bind: switch to the unprivileged user after binding
      - SETGID
    volumes:
      - ./config/named.conf.listen-53:/etc/bind/named.conf.listen:ro
