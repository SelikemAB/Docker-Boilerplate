# BIND 9 — hardened authoritative + recursive DNS server
# Docs: https://hub.docker.com/r/ubuntu/bind9 , https://bind9.readthedocs.io/
# - Runs named directly (no pebble supervisor) as the unprivileged `bind` user (9970) on
#   container port 5053 (host 53 -> 5053), no capabilities, read-only root FS
# - Config mounted read-only, TSIG key as a Docker secret, DNSSEC inline signing
# - Recursion limited to private networks, response rate limiting, rndc on loopback only

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  bind9:
    <<: *hardening
    image: docker.io/ubuntu/bind9:9.20-26.04_edge
    container_name: ${CONTAINER_NAME:-bind9}
    hostname: ${BIND_HOSTNAME:-ns1}
    # The image is a minimal Ubuntu "rock" (no shell). Bypass its pebble supervisor, which
    # needs a writable state dir, and run named in the foreground as `bind` (9970).
    user: "9970:9970"
    entrypoint: ["/usr/sbin/named", "-g", "-c", "/etc/bind/named.conf"]
    read_only: true
    tmpfs:
      - /tmp
      - /run/named
    depends_on:
      init-zones: { condition: service_completed_successfully }
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # HARDENING-EXCEPTION: port — a network DNS server must answer on all interfaces by default.
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:${DNS_PORT:-53}:5053/tcp"
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:${DNS_PORT:-53}:5053/udp"
    secrets: [bind_tsig_key, bind_rndc_key]
    volumes:
      - ./config/named.conf:/etc/bind/named.conf:ro
      - ./config/named.conf.zones:/etc/bind/named.conf.zones:ro
      - ./config/named.conf.listen:/etc/bind/named.conf.listen:ro
      - ./config/rndc.conf:/etc/bind/rndc.conf:ro
      - bind9-zones:/var/lib/bind
      - bind9-cache:/var/cache/bind
    # No `networks:` on purpose: the implicit default bridge has egress for the forwarders, and
    # compose.host-network.yaml can switch to host networking without conflicts.
    healthcheck:
      # No shell or dig in the image: ask named itself over the loopback control channel.
      test: ["CMD", "/usr/sbin/rndc", "-c", "/etc/bind/rndc.conf", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "${BIND_CPUS:-1.0}", memory: "${BIND_MEMORY:-512M}", pids: 200 }

  # One-shot helper: seeds the zone file on first start and hands the data volumes to `bind`
  # (9970). Uses Alpine because the bind9 image has no shell.
  init-zones:
    <<: *hardening
    image: docker.io/library/alpine:3.24.2
    restart: "no"
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - "[ -f /var/lib/bind/db.primary.zone ] || cp /seed/db.primary.zone /var/lib/bind/db.primary.zone; chown -R 9970:9970 /var/lib/bind /var/cache/bind"
    # CHOWN: hand the volumes to `bind`. DAC_OVERRIDE: seed into a dir already owned by `bind`.
    cap_add: [CHOWN, DAC_OVERRIDE]
    network_mode: none
    volumes:
      - ./config/zones:/seed:ro
      - bind9-zones:/var/lib/bind
      - bind9-cache:/var/cache/bind
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 32M, pids: 20 }

secrets:
  bind_tsig_key:
    file: ./secrets/bind_tsig_key
  bind_rndc_key:
    file: ./secrets/bind_rndc_key

volumes:
  bind9-zones:
  bind9-cache:
