# BIND 9 — hardened authoritative + recursive DNS server
# Docs: https://hub.docker.com/r/ubuntu/bind9 , https://bind9.readthedocs.io/
# - Runs as the unprivileged `bind` user on container port 5053 (host 53 -> 5053), no
#   capabilities, read-only root FS
# - Config mounted read-only, TSIG key as a Docker secret, DNSSEC inline signing
# - Recursion limited to private networks, response rate limiting, no rndc channel

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  bind9:
    <<: *hardening
    image: docker.io/ubuntu/bind9:9.20-26.04_edge
    container_name: ${CONTAINER_NAME:-bind9}
    hostname: ${BIND_HOSTNAME:-ns1}
    user: "bind:bind"
    read_only: true
    tmpfs:
      - /tmp
      - /run/named
    depends_on:
      init-zones: { condition: service_completed_successfully }
    environment:
      TZ: ${TZ:-UTC}
      BIND9_USER: bind
    ports:
      # HARDENING-EXCEPTION: port — a network DNS server must answer on all interfaces by default.
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:${DNS_PORT:-53}:5053/tcp"
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:${DNS_PORT:-53}:5053/udp"
    secrets: [bind_tsig_key]
    volumes:
      - ./config/named.conf:/etc/bind/named.conf:ro
      - ./config/named.conf.zones:/etc/bind/named.conf.zones:ro
      - ./config/named.conf.listen:/etc/bind/named.conf.listen:ro
      - bind9-zones:/var/lib/bind
      - bind9-cache:/var/cache/bind
    # No `networks:` on purpose: the implicit default bridge has egress for the forwarders, and
    # compose.host-network.yaml can switch to host networking without conflicts.
    healthcheck:
      # The image has no dig; check that named accepts TCP on its DNS port (5053, or 53 in overrides).
      test: ["CMD", "bash", "-c", "(exec 3<>/dev/tcp/127.0.0.1/5053) 2>/dev/null || exec 3<>/dev/tcp/127.0.0.1/53"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    pids_limit: 200
    deploy:
      resources:
        limits: { cpus: "${BIND_CPUS:-1.0}", memory: "${BIND_MEMORY:-512M}" }

  # One-shot helper: seeds the zone file on first start and hands the data volumes to `bind`.
  init-zones:
    <<: *hardening
    image: docker.io/ubuntu/bind9:9.20-26.04_edge
    restart: "no"
    entrypoint:
      - sh
      - -c
      - "[ -f /var/lib/bind/db.primary.zone ] || cp /seed/db.primary.zone /var/lib/bind/db.primary.zone; chown -R bind:bind /var/lib/bind /var/cache/bind"
    # CHOWN: hand the volumes to `bind`. DAC_OVERRIDE: seed into a dir already owned by `bind`.
    cap_add: [CHOWN, DAC_OVERRIDE]
    network_mode: none
    volumes:
      - ./config/zones:/seed:ro
      - bind9-zones:/var/lib/bind
      - bind9-cache:/var/cache/bind
    pids_limit: 20
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 32M }

secrets:
  bind_tsig_key:
    file: ./secrets/bind_tsig_key

volumes:
  bind9-zones:
  bind9-cache:
