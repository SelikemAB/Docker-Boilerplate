# Optional: give Technitium its own IP address on the LAN (macvlan).
#   docker compose -f compose.yaml -f compose.macvlan.yaml up -d
# Clients query <MACVLAN_IPV4_ADDRESS>:53 directly. The Docker host itself cannot reach a macvlan
# address without an extra macvlan shim interface on the host.

services:
  technitium:
    networks:
      lan:
        ipv4_address: ${MACVLAN_IPV4_ADDRESS:?set MACVLAN_IPV4_ADDRESS in .env}

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:?set MACVLAN_SUBNET in .env}
          gateway: ${MACVLAN_GATEWAY:?set MACVLAN_GATEWAY in .env}
