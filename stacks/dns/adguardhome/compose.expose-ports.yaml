# Optional: publish the web UI directly (e.g. on a host without Traefik).
#   docker compose -f compose.yaml -f compose.expose-ports.yaml up -d
# Loopback by default: reach it with an SSH tunnel, or set BIND_ADDRESS to a management IP.
# The UI is plain HTTP on this port, so don't expose it to untrusted networks.

services:
  adguardhome:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADGUARD_WEB_PORT:-3000}:3000/tcp"
