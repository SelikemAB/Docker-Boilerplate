# Optional: let authentik deploy and manage outposts (proxy/LDAP/RADIUS) as Docker containers.
# Usage: docker compose -f compose.yaml -f compose.docker-outposts.yaml up -d
# Then in authentik: System > Outpost Integrations > Create > Docker Service Connection,
#   URL: tcp://authentik-socket-proxy:2375, Local: off.
#
# HARDENING-EXCEPTION: docker socket — creating outpost containers requires write access to the
# Docker API (POST=1). The socket itself is mounted read-only into a filtered proxy on an internal
# network and the worker never sees it, but anything that can reach the proxy can start containers.
# Leave this override off and deploy outposts manually unless you need managed outposts.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: authentik-socket-proxy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    read_only: true
    tmpfs: [/tmp, /run]
    environment:
      # Only the endpoints authentik's Docker controller uses.
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      AUTH: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      LOG_LEVEL: warning
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [socket]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 100
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  worker:
    depends_on:
      socket-proxy: { condition: service_healthy }
    networks: [backend, egress, socket]

networks:
  socket:
    internal: true
