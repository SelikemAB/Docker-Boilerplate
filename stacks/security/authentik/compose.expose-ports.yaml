# Optional: direct access without Traefik (e.g. initial testing or an external load balancer).
# Usage: docker compose -f compose.yaml -f compose.expose-ports.yaml up -d
# Binds to loopback by default; set BIND_ADDRESS to expose on a specific interface.

services:
  server:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${AUTHENTIK_HTTPS_PORT:-9443}:9443"
