# Optional: direct access without Traefik. Binds to loopback by default.
# 8080 = HTTP, 4433 = HTTPS with the container's self-signed certificate.
# Usage: docker compose -f compose.yaml -f compose.expose-ports.yaml up -d
# APP_FULL_BASE_URL must match the URL you actually use.

services:
  passbolt:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PASSBOLT_HTTP_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${PASSBOLT_HTTPS_PORT:-4433}:4433"
