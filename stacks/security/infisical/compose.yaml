# Infisical — hardened self-hosted secrets management platform
# Docs: https://infisical.com/docs/self-hosting/overview
# - Runs as the image's non-root user (UID 1001), no capabilities
# - Secrets are Docker secrets, loaded into the process environment by a small wrapper
#   (Infisical has no *_FILE support), so they never appear in `docker inspect`
# - PostgreSQL and Redis on an internal network, both non-root with read-only root FS

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  infisical:
    <<: *hardening
    image: docker.io/infisical/infisical:v0.165.16
    container_name: infisical
    user: "1001:1001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Read the Docker secrets, build the connection URIs, then hand over to the image's
    # own entrypoint (./standalone-entrypoint.sh in WORKDIR /backend).
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ENCRYPTION_KEY="$$(cat /run/secrets/infisical_encryption_key)"
        AUTH_SECRET="$$(cat /run/secrets/infisical_auth_secret)"
        DB_CONNECTION_URI="postgresql://$${DB_USER}:$$(cat /run/secrets/postgres_password)@postgres:5432/$${DB_NAME}?sslmode=disable"
        REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"
        export ENCRYPTION_KEY AUTH_SECRET DB_CONNECTION_URI REDIS_URL
        if [ -f /run/secrets/smtp_password ]; then SMTP_PASSWORD="$$(cat /run/secrets/smtp_password)"; export SMTP_PASSWORD; fi
        exec ./standalone-entrypoint.sh
    environment:
      TZ: ${TZ:-UTC}
      NODE_ENV: production
      SITE_URL: https://${INFISICAL_HOST}
      DB_USER: ${POSTGRES_USER:-infisical}
      DB_NAME: ${POSTGRES_DB:-infisical}
      TELEMETRY_ENABLED: ${INFISICAL_TELEMETRY_ENABLED:-false}
      NODE_OPTIONS: ${INFISICAL_NODE_OPTIONS:---max-old-space-size=1536}
    secrets: [infisical_encryption_key, infisical_auth_secret, postgres_password, redis_password]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      traefik.http.routers.infisical.rule: Host(`${INFISICAL_HOST}`)
      traefik.http.routers.infisical.entrypoints: websecure
      traefik.http.services.infisical.loadbalancer.server.port: "8080"
    # proxy: Traefik ingress + egress (SMTP, integrations, secret syncs). backend: DB and cache.
    networks: [proxy, backend]
    healthcheck:
      # Slim Debian image without curl/wget; use Node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "${INFISICAL_CPUS:-2.0}", memory: "${INFISICAL_MEMORY:-2G}", pids: 300 }

  postgres:
    <<: *hardening
    image: docker.io/library/postgres:18.6-alpine
    container_name: infisical-postgres
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 256m
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${POSTGRES_USER:-infisical}
      POSTGRES_DB: ${POSTGRES_DB:-infisical}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [postgres_password]
    volumes:
      - infisical-postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "${POSTGRES_CPUS:-1.0}", memory: "${POSTGRES_MEMORY:-1G}", pids: 300 }

  redis:
    <<: *hardening
    image: docker.io/library/redis:8.10.2-alpine
    container_name: infisical-redis
    user: "999:1000"  # redis:redis in the Alpine image
    read_only: true
    tmpfs: [/tmp]
    # Password is written to a tmpfs config file so it doesn't show up in the process list.
    command:
      - /bin/sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf --appendonly yes --save 60 1000 --protected-mode yes
    secrets: [redis_password]
    volumes:
      - infisical-redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "${REDIS_CPUS:-0.5}", memory: "${REDIS_MEMORY:-512M}", pids: 100 }

secrets:
  infisical_encryption_key:
    file: ./secrets/infisical_encryption_key
  infisical_auth_secret:
    file: ./secrets/infisical_auth_secret
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password

volumes:
  infisical-postgres:
  infisical-redis:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  backend:
    internal: true
