# Optional: outgoing e-mail (invitations, MFA codes, password resets).
# Usage: docker compose -f compose.yaml -f compose.smtp.yaml up -d
# Requires ./secrets/smtp_password; the entrypoint wrapper exports it as SMTP_PASSWORD.

services:
  infisical:
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-infisical@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Infisical}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
    secrets: [smtp_password]

secrets:
  smtp_password:
    file: ./secrets/smtp_password
