# Optional: read container logs (e.g. Traefik's JSON access log on stdout) via the Docker API.
# Usage:
#   cp config/optional/docker.yaml config/acquis.d/docker.yaml
#   docker compose -f compose.yaml -f compose.docker-logs.yaml up -d
# CrowdSec talks to a read-only, filtered socket proxy instead of mounting the socket.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: crowdsec-socket-proxy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    read_only: true
    tmpfs: [/tmp, /run]
    environment:
      # Read-only: list/inspect containers, stream their logs, follow events.
      CONTAINERS: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [socket]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 100
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  crowdsec:
    depends_on:
      socket-proxy: { condition: service_healthy }
    networks: [crowdsec, proxy, socket]

networks:
  socket:
    internal: true
