# Prometheus — hardened metrics server and time-series database
# Docs: https://prometheus.io/docs/
# - Non-root (nobody, UID 65534), no capabilities, read-only root FS
# - Remote-write receiver enabled for Grafana Alloy; config mounted read-only
# - No published ports: reachable on the internal monitoring network and via Traefik

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  prometheus:
    <<: *hardening
    image: docker.io/prom/prometheus:v3.15.0
    container_name: ${CONTAINER_NAME:-prometheus}
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      # 0B = no size limit (time-based retention only).
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-0B}
      # Accepts pushes from Grafana Alloy (alloy stack). See README before exposing it.
      - --web.enable-remote-write-receiver
      - --web.external-url=https://${PROMETHEUS_HOST}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: Host(`${PROMETHEUS_HOST}`)
      traefik.http.routers.prometheus.entrypoints: websecure
      # Prometheus has no built-in login: restrict the UI/API to private ranges.
      traefik.http.routers.prometheus.middlewares: internal-only@file
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    networks: [proxy, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "${PROMETHEUS_CPUS:-1.0}", memory: "${PROMETHEUS_MEMORY:-2G}", pids: 300 }

volumes:
  prometheus-data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  # Shared observability network (Alloy pushes here, Grafana queries here).
  monitoring:
    name: ${MONITORING_NETWORK:-monitoring}
    external: true
