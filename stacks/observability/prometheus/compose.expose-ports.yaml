# Optional: publish the Prometheus UI/API directly (without Traefik).
# Usage: docker compose -f compose.yaml -f compose.expose-ports.yaml up -d
# Prometheus has no authentication and accepts remote writes. Keep BIND_ADDRESS trusted.
services:
  prometheus:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
