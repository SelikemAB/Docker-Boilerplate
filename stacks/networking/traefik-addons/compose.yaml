# traefik-addons — test service for the extra Traefik middlewares
# The real payload of this stack is config/dynamic/*.yaml (drop-in for the traefik stack).
# whoami echoes request headers, which makes it easy to verify chains, forward-auth
# response headers and client-IP handling.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  whoami:
    <<: *hardening
    image: docker.io/traefik/whoami:v1.12.0
    container_name: ${CONTAINER_NAME:-whoami}
    user: "65532:65532"
    read_only: true
    # Unprivileged port, so no NET_BIND_SERVICE is needed.
    command: ["--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      traefik.http.routers.whoami.rule: Host(`${WHOAMI_HOST}`)
      traefik.http.routers.whoami.entrypoints: websecure
      traefik.http.routers.whoami.middlewares: ${WHOAMI_MIDDLEWARES:-internal-secured@file}
      traefik.http.services.whoami.loadbalancer.server.port: "8080"
    networks: [proxy]
    # HARDENING-EXCEPTION: healthcheck — scratch image with only the whoami binary; no shell or HTTP client to probe /health.
    pids_limit: 50
    deploy:
      resources:
        limits: { cpus: "${WHOAMI_CPUS:-0.1}", memory: "${WHOAMI_MEMORY:-32M}" }

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
