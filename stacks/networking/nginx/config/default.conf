# Static site. The unprivileged image listens on 8080 (no root needed).
server {
    listen 8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik adds HSTS and the global security headers; these are defence in depth.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Liveness probe for the Docker healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles (.git, .env, ...).
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
