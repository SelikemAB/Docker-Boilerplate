# Caddy — hardened web server / reverse proxy with automatic HTTPS
# Docs: https://caddyserver.com/docs/
# - Runs as non-root on unprivileged container ports (8080/8443), read-only root FS
# - Modular Caddyfile: every config/*.caddy file is imported
# - Admin API stays on the container's loopback interface (localhost:2019)
# NOTE: Caddy is an alternative edge proxy to the traefik stack. Don't run both on 80/443.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  caddy:
    <<: *hardening
    image: docker.io/library/caddy:2.11.4-alpine
    container_name: ${CONTAINER_NAME:-caddy}
    # No caddy user exists in the image; any UID works because /data/caddy and
    # /config/caddy are world-writable (1777) in the image and copied into fresh volumes.
    user: "${PUID:-65532}:${PGID:-65532}"
    read_only: true
    tmpfs: [/tmp]
    environment:
      TZ: ${TZ:-UTC}
      # Consumed by the Caddyfile / config/*.caddy via {$VAR} placeholders.
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
    ports:
      # HARDENING-EXCEPTION: port — the edge web server must listen on all interfaces by default.
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config:/etc/caddy/config:ro
      - ${CADDY_SITE_PATH:-./site}:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [caddy]
    healthcheck:
      # Admin API answers on loopback only; a 200 means the config is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    pids_limit: 200
    deploy:
      resources:
        limits: { cpus: "${CADDY_CPUS:-1.0}", memory: "${CADDY_MEMORY:-512M}" }

volumes:
  caddy-data:     # certificates, ACME account keys, OCSP staples
  caddy-config:   # autosaved runtime config

networks:
  # Upstream stacks join this network so Caddy can reach them by service name.
  caddy:
    name: ${CADDY_NETWORK:-caddy}
