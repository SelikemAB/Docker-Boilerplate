---
# Homer configuration. Reference: https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md
# Icons: Font Awesome 7 (https://fontawesome.com/icons), e.g. "fas fa-server".
# Put your own images in ../assets/ and reference them as "assets/custom/<file>".
# The file is mounted read-only; edit it on the host, then reload the page.

title: "Dashboard"
subtitle: "Dashboard"
logo: "assets/icons/logo.svg"  # built-in logo; use "assets/custom/logo.png" for your own
# icon: "fas fa-home"  # optional icon instead of logo

header: true
footer: false  # set to "<Message>" to enable a footer with a custom message

# Theme customization
theme: default  # options: default, sui, walkxcode
# colors:
#   light:
#     highlight-primary: "#3367d6"
#     highlight-secondary: "#4285f4"
#     highlight-hover: "#5a95f5"
#     background: "#f5f5f5"
#     card-background: "#ffffff"
#     text: "#363636"
#     text-header: "#ffffff"
#   dark:
#     highlight-primary: "#3367d6"
#     highlight-secondary: "#4285f4"
#     highlight-hover: "#5a95f5"
#     background: "#131313"
#     card-background: "#2b2b2b"
#     text: "#eaeaea"
#     text-header: "#ffffff"

# Optional message displayed at the top
# message:
#   style: "is-dark"  # options: is-dark, is-warning, is-info, is-success, is-danger
#   title: "Welcome!"
#   icon: "fa fa-grin"
#   content: "This is your Homer dashboard. <br /> Add your services below."

# Optional navbar links
# links:
#   - name: "Documentation"
#     icon: "fas fa-book"
#     url: "https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md"
#     target: "_blank"  # optional: open in new tab

# Services
# First level array represents a group.
# Leave only an "items" key if not using groups (group name, icon & tagstyle are optional).
services:
  - name: "Applications"
    icon: "fas fa-cloud"
    items: []
    # items:
    #   - name: "Example App"
    #     logo: "assets/custom/sample.png"  # or use "icon: fas fa-server"
    #     subtitle: "Description of the app"
    #     tag: "app"  # optional tag
    #     tagstyle: "is-success"  # optional: is-success, is-warning, is-info, is-danger
    #     url: "https://example.com"
    #     target: "_blank"  # optional: open in new tab

