# Optional: publish the web UI directly (no Traefik), bound to loopback by default.
# Usage: docker compose -f compose.yaml -f compose.expose-ports.yaml up -d
# Set FORGEJO_HOST to the name clients use; ROOT_URL is derived from it (adjust below if not HTTPS).
services:
  forgejo:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FORGEJO_HTTP_PORT:-3000}:3000"
    environment:
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://localhost:3000/}
      FORGEJO__session__COOKIE_SECURE: "false"
