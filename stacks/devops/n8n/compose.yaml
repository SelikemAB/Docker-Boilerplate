# n8n — hardened workflow automation platform
# Docs: https://docs.n8n.io/hosting/installation/docker/
# - Non-root (node, UID 1000), no capabilities
# - PostgreSQL on an internal network; DB password and encryption key via *_FILE secrets
# - Editor internal-only via Traefik; webhook/form endpoints public

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  n8n:
    <<: *hardening
    image: docker.n8n.io/n8nio/n8n:2.41.3
    container_name: ${CONTAINER_NAME:-n8n}
    hostname: ${CONTAINER_NAME:-n8n}
    user: "1000:1000"
    tmpfs:
      - /tmp
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      NODE_ENV: production
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_db_password
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      # Privacy: no telemetry, version checks or template gallery calls home
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}
      N8N_TEMPLATES_ENABLED: ${N8N_TEMPLATES_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: "false"
      # Housekeeping of execution data
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-336}
    secrets: [n8n_db_password, n8n_encryption_key]
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      # Editor and REST API: internal networks only
      traefik.http.routers.n8n.rule: Host(`${N8N_HOST}`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.middlewares: internal-only@file
      traefik.http.routers.n8n.service: n8n
      # Production webhooks and forms: public
      traefik.http.routers.n8n-webhook.rule: Host(`${N8N_HOST}`) && (PathPrefix(`/webhook/`) || PathPrefix(`/webhook-waiting/`) || PathPrefix(`/form/`) || PathPrefix(`/form-waiting/`))
      traefik.http.routers.n8n-webhook.entrypoints: websecure
      traefik.http.routers.n8n-webhook.service: n8n
      traefik.http.services.n8n.loadbalancer.server.port: "5678"
    # proxy network also provides the egress workflows need.
    networks: [proxy, backend]
    healthcheck:
      # Uses node (always present) instead of wget/curl, which the hardened base may lack.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    pids_limit: 500
    deploy:
      resources:
        limits: { cpus: "${N8N_CPUS:-2.0}", memory: "${N8N_MEMORY:-2G}" }

  postgres:
    <<: *hardening
    image: docker.io/library/postgres:18.6-alpine
    container_name: ${CONTAINER_NAME:-n8n}-postgres
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 128m
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_PASSWORD_FILE: /run/secrets/n8n_db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [n8n_db_password]
    volumes:
      - n8n-postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    pids_limit: 200
    deploy:
      resources:
        limits: { cpus: "${POSTGRES_CPUS:-1.0}", memory: "${POSTGRES_MEMORY:-1G}" }

secrets:
  n8n_db_password:
    file: ./secrets/n8n_db_password
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key

volumes:
  n8n-data:
  n8n-postgres:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  backend:
    internal: true
