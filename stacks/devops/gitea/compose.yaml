# Gitea — hardened self-hosted Git service (hosting, code review, issues, packages)
# Docs: https://docs.gitea.com/installation/install-with-docker-rootless
# - Rootless image (UID 1000), no capabilities, read-only root FS
# - PostgreSQL backend on an internal network; secrets via GITEA-style __FILE variables
# - Web UI through Traefik; built-in SSH server on an unprivileged port

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  gitea:
    <<: *hardening
    image: docker.io/gitea/gitea:1.27.3-rootless
    container_name: ${CONTAINER_NAME:-gitea}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TZ: ${TZ:-UTC}
      # environment-to-ini writes these into app.ini on every start.
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD__FILE: /run/secrets/gitea_db_password
      GITEA__database__SSL_MODE: disable
      GITEA__server__DOMAIN: ${GITEA_HOST}
      GITEA__server__SSH_DOMAIN: ${GITEA_HOST}
      GITEA__server__ROOT_URL: https://${GITEA_HOST}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      # Port shown in clone URLs (the published host port).
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2221}
      GITEA__server__LANDING_PAGE: ${GITEA_LANDING_PAGE:-login}
      # Skip the web installer: config comes from env, the admin is created via CLI.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY__FILE: /run/secrets/gitea_secret_key
      GITEA__security__INTERNAL_TOKEN__FILE: /run/secrets/gitea_internal_token
      GITEA__security__PASSWORD_HASH_ALGO: argon2
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-true}
      GITEA__service__REQUIRE_SIGNIN_VIEW: ${GITEA_REQUIRE_SIGNIN_VIEW:-false}
      GITEA__session__COOKIE_SECURE: "true"
      GITEA__log__LEVEL: ${GITEA_LOG_LEVEL:-Info}
    secrets: [gitea_db_password, gitea_secret_key, gitea_internal_token]
    ports:
      # HARDENING-EXCEPTION: port — Git over SSH must be reachable by clients, so it binds all interfaces by default.
      - "${SSH_BIND_ADDRESS:-0.0.0.0}:${GITEA_SSH_PORT:-2221}:2222"
    volumes:
      # Repositories, LFS, attachments, packages
      - gitea-data:/var/lib/gitea
      # app.ini (GITEA_APP_INI=/etc/gitea/app.ini)
      - gitea-config:/etc/gitea
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      traefik.http.routers.gitea.rule: Host(`${GITEA_HOST}`)
      traefik.http.routers.gitea.entrypoints: websecure
      traefik.http.services.gitea.loadbalancer.server.port: "3000"
    networks: [proxy, backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "${GITEA_CPUS:-2.0}", memory: "${GITEA_MEMORY:-2G}", pids: 500 }

  postgres:
    <<: *hardening
    image: docker.io/library/postgres:18.6-alpine
    container_name: ${CONTAINER_NAME:-gitea}-postgres
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 128m
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_PASSWORD_FILE: /run/secrets/gitea_db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [gitea_db_password]
    volumes:
      - gitea-postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "${POSTGRES_CPUS:-1.0}", memory: "${POSTGRES_MEMORY:-1G}", pids: 200 }

secrets:
  gitea_db_password:
    file: ./secrets/gitea_db_password
  gitea_secret_key:
    file: ./secrets/gitea_secret_key
  gitea_internal_token:
    file: ./secrets/gitea_internal_token

volumes:
  gitea-data:
  gitea-config:
  gitea-postgres:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  backend:
    internal: true
