# Optional: publish the web UI directly (no Traefik), bound to loopback by default.
# Usage: docker compose -f compose.yaml -f compose.expose-ports.yaml up -d
# Set GITEA_HOST to the name clients use; ROOT_URL is derived from it (adjust below if not HTTPS).
services:
  gitea:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GITEA_HTTP_PORT:-3000}:3000"
    environment:
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3000/}
      GITEA__session__COOKIE_SECURE: "false"
