# Kestra — hardened workflow orchestration platform (standalone server + PostgreSQL)
# Docs: https://kestra.io/docs/installation/docker-compose
# - Kestra runs as its non-root image user (UID 1000) with no capabilities
# - The Docker task runner reaches Docker only through a filtered socket proxy (no raw socket mount)
# - UI internal-only via Traefik; execution webhooks public

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  kestra:
    <<: *hardening
    image: docker.io/kestra/kestra:v2.0.3
    container_name: ${CONTAINER_NAME:-kestra}
    user: "1000:1000"
    depends_on:
      postgres: { condition: service_healthy }
      docker-socket: { condition: service_healthy }
      init-perms: { condition: service_completed_successfully }
    # Export the secrets into the process environment (Kestra config cannot read files),
    # then exec the server so it receives signals directly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export K_DB_PASSWORD="$$(cat /app/secrets/kestra_db_password)"
        K_ADMIN_PASSWORD="$$(cat /app/secrets/kestra_admin_password)" &&
        exec /app/kestra server standalone
        --worker-thread=${KESTRA_WORKER_THREADS:-128}
        -c /app/confs/config.yaml
    environment:
      TZ: ${TZ:-UTC}
      K_DB_NAME: ${KESTRA_DB_NAME:-kestra}
      K_DB_USER: ${KESTRA_DB_USER:-kestra}
      K_ADMIN_USER: ${KESTRA_ADMIN_USER:-admin@example.com}
      K_PUBLIC_URL: https://${KESTRA_HOST}/
      K_TUTORIAL_FLOWS: ${KESTRA_TUTORIAL_FLOWS:-false}
    secrets:
      # Absolute targets, because /run is replaced by the shared Docker-socket volume below.
      - source: kestra_db_password
        target: /app/secrets/kestra_db_password
      - source: kestra_admin_password
        target: /app/secrets/kestra_admin_password
    volumes:
      - ./config/config.yaml:/app/confs/config.yaml:ro
      - kestra-data:/app/storage
      # Working directory shared with task containers: host path must equal container path.
      - /tmp/kestra-wd:/tmp/kestra-wd
      # /run/docker.sock (= /var/run/docker.sock) is a socat relay to the filtered socket proxy,
      # so the Docker task runner works without flow changes and without the host socket.
      - kestra-docker-sock:/run
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      # UI and API: internal networks only
      traefik.http.routers.kestra.rule: Host(`${KESTRA_HOST}`)
      traefik.http.routers.kestra.entrypoints: websecure
      traefik.http.routers.kestra.middlewares: internal-only@file
      traefik.http.routers.kestra.service: kestra
      # Execution webhook triggers: public (authenticated by the per-trigger webhook key)
      traefik.http.routers.kestra-webhook.rule: Host(`${KESTRA_HOST}`) && (PathPrefix(`/api/v1/main/executions/webhook/`) || PathPrefix(`/api/v1/executions/webhook/`))
      traefik.http.routers.kestra-webhook.entrypoints: websecure
      traefik.http.routers.kestra-webhook.service: kestra
      traefik.http.services.kestra.loadbalancer.server.port: "8080"
    # The proxy network also provides egress for plugins and HTTP tasks.
    networks: [proxy, backend]
    healthcheck:
      # /ping is always unauthenticated; management :8081/health requires auth for details in 2.x.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Kestra waits up to 5 min for running tasks on shutdown.
    stop_grace_period: 6m
    # JVM + worker threads (every thread counts against the pids limit).
    deploy:
      resources:
        limits: { cpus: "${KESTRA_CPUS:-2.0}", memory: "${KESTRA_MEMORY:-4G}", pids: 2048 }

  # Relays a Unix socket in the shared volume to the filtered socket proxy.
  docker-socket:
    <<: *hardening
    # Community image (alpine org): minimal Alpine + socat; there is no official socat image.
    image: docker.io/alpine/socat:1.8.1.3
    container_name: ${CONTAINER_NAME:-kestra}-docker-socket
    user: "1000:1000"
    read_only: true
    depends_on:
      socket-proxy: { condition: service_healthy }
      init-perms: { condition: service_completed_successfully }
    command:
      - UNIX-LISTEN:/sock/docker.sock,fork,unlink-early,mode=600
      - TCP:socket-proxy:2375
    volumes:
      - kestra-docker-sock:/sock
    networks: [socket]
    healthcheck:
      test: ["CMD-SHELL", "test -S /sock/docker.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 200 }

  socket-proxy:
    <<: *hardening
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: ${CONTAINER_NAME:-kestra}-socket-proxy
    read_only: true
    tmpfs: [/tmp, /run]
    environment:
      # What the Docker task runner needs: pull images, create/start/wait/log/remove
      # containers, optional volumes. POST=1 is required to create containers.
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      EVENTS: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SERVICES: 0
      SECRETS: 0
      SYSTEM: 0
      AUTH: 0
      PLUGINS: 0
      LOG_LEVEL: warning
    volumes:
      # HARDENING-EXCEPTION: docker socket — the Docker task runner must create and remove task containers, so this proxy allows POST (root-equivalent; see README).
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [socket]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 100 }

  postgres:
    <<: *hardening
    image: docker.io/library/postgres:18.6-alpine
    container_name: ${CONTAINER_NAME:-kestra}-postgres
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 256m
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${KESTRA_DB_USER:-kestra}
      POSTGRES_DB: ${KESTRA_DB_NAME:-kestra}
      POSTGRES_PASSWORD_FILE: /run/secrets/kestra_db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [kestra_db_password]
    volumes:
      - kestra-postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "${POSTGRES_CPUS:-1.0}", memory: "${POSTGRES_MEMORY:-2G}", pids: 300 }

  # One-shot helper: hands storage, the working directory and the socket volume to UID 1000.
  init-perms:
    image: docker.io/kestra/kestra:v2.0.3
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /app/storage /tmp/kestra-wd /sock && chmod 750 /sock"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]  # needed only to chown the volume roots
    network_mode: none
    volumes:
      - kestra-data:/app/storage
      - /tmp/kestra-wd:/tmp/kestra-wd
      - kestra-docker-sock:/sock
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 64M, pids: 20 }

secrets:
  kestra_db_password:
    file: ./secrets/kestra_db_password
  kestra_admin_password:
    file: ./secrets/kestra_admin_password

volumes:
  kestra-data:
  kestra-postgres:
  kestra-docker-sock:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  backend:
    internal: true
  socket:
    internal: true
