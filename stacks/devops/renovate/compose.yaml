# Mend Renovate Community Edition — self-hosted Renovate server + worker (GitLab)
# Docs: https://github.com/mend/renovate-ce-ee/tree/main/docs
# - Non-root (UID 12021), no capabilities
# - Webhook endpoint public via Traefik; the rest of the API limited to internal networks
# - SQLite job database and job logs persisted in named volumes

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging

services:
  renovate:
    <<: *hardening
    image: ghcr.io/mend/renovate-ce:15.6.0-full
    container_name: ${CONTAINER_NAME:-renovate}
    hostname: ${CONTAINER_NAME:-renovate}
    # Image user (ubuntu, 12021:0). Root FS stays writable: the "full" image's containerbase
    # tooling writes caches under the home directory and /tmp at runtime.
    user: "12021:0"
    depends_on:
      init-perms: { condition: service_completed_successfully }
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${RENOVATE_LOG_LEVEL:-info}
      LOG_FORMAT: json
      MEND_RNV_ACCEPT_TOS: ${MEND_RNV_ACCEPT_TOS:?Set MEND_RNV_ACCEPT_TOS=y in .env to accept the Mend Terms of Service}
      # No *_FILE support upstream: these three come from .env (chmod 600).
      MEND_RNV_LICENSE_KEY: ${MEND_RNV_LICENSE_KEY:?Set MEND_RNV_LICENSE_KEY in .env}
      MEND_RNV_GITLAB_PAT: ${MEND_RNV_GITLAB_PAT:?Set MEND_RNV_GITLAB_PAT in .env}
      MEND_RNV_WEBHOOK_SECRET: ${MEND_RNV_WEBHOOK_SECRET:?Set MEND_RNV_WEBHOOK_SECRET in .env}
      MEND_RNV_PLATFORM: ${RENOVATE_PLATFORM:-gitlab}
      MEND_RNV_ENDPOINT: ${RENOVATE_ENDPOINT:-https://gitlab.com/api/v4/}
      MEND_RNV_SERVER_PORT: "8080"
      MEND_RNV_SQLITE_FILE_PATH: /db/renovate-ce.sqlite
      MEND_RNV_LOG_HISTORY_DIR: /logs
      RENOVATE_AUTODISCOVER: ${RENOVATE_AUTODISCOVER:-false}
      RENOVATE_REPOSITORY_CACHE: enabled
    volumes:
      - renovate-db:/db
      - renovate-logs:/logs
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      # Webhooks from the Git platform (authenticated by MEND_RNV_WEBHOOK_SECRET)
      traefik.http.routers.renovate-webhook.rule: Host(`${RENOVATE_HOST}`) && PathPrefix(`/webhook`)
      traefik.http.routers.renovate-webhook.entrypoints: websecure
      traefik.http.routers.renovate-webhook.service: renovate
      # Everything else (health, APIs if enabled) only from internal networks
      traefik.http.routers.renovate.rule: Host(`${RENOVATE_HOST}`)
      traefik.http.routers.renovate.entrypoints: websecure
      traefik.http.routers.renovate.middlewares: internal-only@file
      traefik.http.routers.renovate.service: renovate
      traefik.http.services.renovate.loadbalancer.server.port: "8080"
    # proxy network also provides the egress Renovate needs (Git platform, registries).
    networks: [proxy]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "${RENOVATE_CPUS:-2.0}", memory: "${RENOVATE_MEMORY:-4G}", pids: 1000 }

  # One-shot helper: makes the DB and log volumes writable by the non-root Renovate user.
  init-perms:
    image: ghcr.io/mend/renovate-ce:15.6.0-full
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 12021:0 /db /logs && chmod 770 /db /logs"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]  # needed only to chown the volume roots
    network_mode: none
    volumes:
      - renovate-db:/db
      - renovate-logs:/logs
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 32M, pids: 20 }

volumes:
  renovate-db:
  renovate-logs:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
