name: Validate stacks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Hardening lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - run: python scripts/lint.py
      - name: Catalogue and VERSIONS.md are up to date
        run: python scripts/catalog.py --check

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render every stack with its example environment
        run: |
          set -uo pipefail
          : > /tmp/errors.txt
          while IFS= read -r file; do
            dir=$(dirname "$file")
            # Example env + placeholders for variables the stack deliberately requires (${VAR:?...}).
            env_file=$(mktemp)
            cp "$dir/.env.example" "$env_file"
            grep -hoE '\$\{[A-Z0-9_]+:\?' "$dir"/compose*.yaml | sed -E 's/\$\{([A-Z0-9_]+):\?/\1/' | sort -u \
              | while read -r v; do grep -qE "^$v=.+" "$env_file" || echo "$v=ci-placeholder" >> "$env_file"; done
            # Provide dummy secret files so compose can resolve `secrets:` paths.
            if grep -q '^secrets:' "$dir"/compose*.yaml 2>/dev/null; then
              mkdir -p "$dir/secrets"
              grep -hoE 'file: *\./secrets/[^[:space:]]+' "$dir"/compose*.yaml | awk '{print $2}' \
                | while read -r s; do [ -e "$dir/$s" ] || echo dummy > "$dir/$s"; done
            fi
            if head -3 "$file" | grep -q STANDALONE; then
              files=(-f "$file")                      # standalone variant, used on its own
            else
              files=(-f "$dir/compose.yaml")
              [ "$file" != "$dir/compose.yaml" ] && files+=(-f "$file")
            fi
            if ! out=$(docker compose --project-directory "$dir" --env-file "$env_file" "${files[@]}" config --quiet 2>&1); then
              printf '%s: %s\n' "$file" "$out" | tee -a /tmp/errors.txt
            fi
          done < <(find stacks -name 'compose*.yaml' | sort)
          if [ -s /tmp/errors.txt ]; then
            # One annotation with every failure (GitHub shows at most 10 annotations per step).
            echo "::error title=docker compose config::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' /tmp/errors.txt)"
            exit 1
          fi

  yamllint:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install yamllint==1.37.1
      - run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' stacks renovate.json

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
